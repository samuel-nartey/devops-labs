AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Community Wall v2 - serverless app with Amazon Cognito sign-in.
  S3 + CloudFront (frontend), Cognito (identity), API Gateway HTTP API with JWT authorizer,
  Lambda (backend), DynamoDB (data).

Parameters:
  ProjectName:
    Type: String
    Default: community-wall-v2
  EventId:
    Type: String
    Default: kumasi-2026-10-17
    Description: Identifier for the event whose reviews are stored.
  ReviewRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365

Resources:

  # ---------------------------------------------------------------
  # IDENTITY: Cognito user pool, hosted sign-in domain, web client, admin group
  # ---------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        project: !Ref ProjectName

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ProjectName}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${ProjectName}-web'
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub 'https://${Distribution.DomainName}/'
      LogoutURLs:
        - !Sub 'https://${Distribution.DomainName}/'
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Moderators who can delete any review
      UserPoolId: !Ref UserPool

  # ---------------------------------------------------------------
  # DATA: DynamoDB (single table: reviews plus one stats item per event)
  # ---------------------------------------------------------------
  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-data'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------
  # COMPUTE: Lambda, least-privilege role, log group
  # ---------------------------------------------------------------
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DataTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt MessagesTable.Arn
      Tags:
        - Key: project
          Value: !Ref ProjectName

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-api'
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-api'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref MessagesTable
          EVENT_ID: !Ref EventId
          RETENTION_DAYS: !Ref ReviewRetentionDays
      Code:
        ZipFile: |
          import base64
          import json
          import os
          import re
          import time
          import traceback
          import uuid
          from decimal import Decimal
          from urllib.parse import urlparse

          import boto3
          from boto3.dynamodb.conditions import Attr, Key

          db = boto3.resource("dynamodb")
          table = db.Table(os.environ["TABLE_NAME"])
          client = db.meta.client
          TABLE_NAME = os.environ["TABLE_NAME"]
          EVENT_ID = os.environ.get("EVENT_ID", "workshop")
          RETENTION_DAYS = int(os.environ.get("RETENTION_DAYS", "30"))
          PK = f"EVENT#{EVENT_ID}"
          STATS_KEY = {"pk": "STATS", "sk": EVENT_ID}


          def resp(status, body):
              return {
                  "statusCode": status,
                  "headers": {"Content-Type": "application/json", "Cache-Control": "no-store"},
                  "body": json.dumps(body, default=lambda o: int(o) if isinstance(o, Decimal) else str(o)),
              }


          def log(level, msg, **fields):
              print(json.dumps({"level": level, "msg": msg, **fields}))


          def claims(event):
              return event["requestContext"].get("authorizer", {}).get("jwt", {}).get("claims", {})


          def is_admin(c):
              groups = str(c.get("cognito:groups", "")).strip("[]").replace(",", " ").split()
              return "admin" in groups


          SOCIALS = {
              "linkedin": ({"linkedin.com", "www.linkedin.com"}, "https://www.linkedin.com/in/", "/in/", r"[A-Za-z0-9_%-]{3,100}"),
              "x": ({"x.com", "www.x.com", "twitter.com", "www.twitter.com"}, "https://x.com/", "/", r"[A-Za-z0-9_]{1,15}"),
              "github": ({"github.com", "www.github.com"}, "https://github.com/", "/", r"[A-Za-z0-9-]{1,39}"),
          }


          def clean_social(key, value):
              """Accept a username or a profile URL for one known site. Always rebuild a safe canonical link."""
              value = str(value or "").strip()
              if not value:
                  return None
              hosts, base, prefix, pattern = SOCIALS[key]
              handle = value.lstrip("@")
              if value.lower().startswith(("http://", "https://")):
                  parsed = urlparse(value)
                  path = parsed.path.rstrip("/")
                  if (parsed.hostname or "").lower() not in hosts or not path.startswith(prefix):
                      raise ValueError(f"{key} must be a profile link or username on that site")
                  handle = path[len(prefix):]
              if not re.fullmatch(pattern, handle):
                  raise ValueError(f"{key} username looks invalid")
              return base + handle


          def parse_review(event):
              raw = event.get("body") or "{}"
              if len(raw) > 4096:
                  raise ValueError("Request too large")
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  raise ValueError("Body must be valid JSON")
              name = str(data.get("name", "")).strip()[:40]
              country = str(data.get("country", "")).strip()[:40]
              message = str(data.get("message", "")).strip()[:200]
              try:
                  rating = int(data.get("rating"))
              except (TypeError, ValueError):
                  raise ValueError("rating must be a whole number from 1 to 5")
              if not name or not message:
                  raise ValueError("name and message are required")
              if rating < 1 or rating > 5:
                  raise ValueError("rating must be a whole number from 1 to 5")
              raw_socials = data.get("socials") or {}
              if not isinstance(raw_socials, dict):
                  raise ValueError("socials must be an object")
              socials = {}
              for key in SOCIALS:
                  link = clean_social(key, raw_socials.get(key))
                  if link:
                      socials[key] = link
              return name, country, message, rating, socials


          def public(item):
              return {
                  "id": item["sk"],
                  "ownerId": item["userId"],
                  "name": item["name"],
                  "country": item.get("country", ""),
                  "message": item["message"],
                  "rating": int(item["rating"]),
                  "createdAt": int(item["createdAt"]),
                  "socials": item.get("socials", {}),
                  "edited": "updatedAt" in item,
              }


          def stats_update(count_delta, rating_delta):
              return {
                  "Update": {
                      "TableName": TABLE_NAME,
                      "Key": STATS_KEY,
                      "UpdateExpression": "ADD reviewCount :c, ratingSum :r",
                      "ExpressionAttributeValues": {":c": count_delta, ":r": rating_delta},
                  }
              }


          def get_review(review_id):
              item = table.get_item(Key={"pk": PK, "sk": review_id}).get("Item")
              if not item:
                  raise LookupError("Review not found")
              return item


          def list_reviews(event):
              params = event.get("queryStringParameters") or {}
              try:
                  limit = max(1, min(int(params.get("limit", 20)), 50))
              except ValueError:
                  raise ValueError("limit must be a number")
              query = {
                  "KeyConditionExpression": Key("pk").eq(PK),
                  "FilterExpression": Attr("expiresAt").gt(int(time.time())),
                  "ScanIndexForward": False,
                  "Limit": limit,
              }
              token = params.get("nextToken")
              if token:
                  try:
                      start = json.loads(base64.urlsafe_b64decode(token.encode()))
                  except Exception:
                      raise ValueError("Invalid nextToken")
                  if start.get("pk") != PK:
                      raise ValueError("Invalid nextToken")
                  query["ExclusiveStartKey"] = {"pk": start["pk"], "sk": str(start["sk"])}
              result = table.query(**query)
              next_token = None
              if "LastEvaluatedKey" in result:
                  key = {"pk": result["LastEvaluatedKey"]["pk"], "sk": result["LastEvaluatedKey"]["sk"]}
                  next_token = base64.urlsafe_b64encode(json.dumps(key).encode()).decode()
              stats = table.get_item(Key=STATS_KEY).get("Item", {})
              count = int(stats.get("reviewCount", 0))
              total = int(stats.get("ratingSum", 0))
              return resp(200, {
                  "items": [public(i) for i in result["Items"]],
                  "nextToken": next_token,
                  "stats": {"count": count, "average": round(total / count, 2) if count else 0},
              })


          def create_review(event):
              c = claims(event)
              name, country, message, rating, socials = parse_review(event)
              now_ms = int(time.time() * 1000)
              review_id = f"{now_ms:013d}#{uuid.uuid4().hex[:8]}"
              item = {
                  "pk": PK, "sk": review_id, "userId": c["sub"], "name": name, "country": country,
                  "message": message, "rating": rating, "socials": socials, "createdAt": now_ms,
                  "expiresAt": now_ms // 1000 + RETENTION_DAYS * 86400,
              }
              client.transact_write_items(TransactItems=[
                  {"Put": {"TableName": TABLE_NAME, "Item": item, "ConditionExpression": "attribute_not_exists(pk)"}},
                  stats_update(1, rating),
              ])
              log("info", "review_created", reviewId=review_id, userId=c["sub"])
              return resp(201, public(item))


          def update_review(event):
              c = claims(event)
              review_id = event["pathParameters"]["id"]
              item = get_review(review_id)
              if item["userId"] != c["sub"]:
                  raise PermissionError("You can only edit your own review")
              name, country, message, rating, socials = parse_review(event)
              now_ms = int(time.time() * 1000)
              client.transact_write_items(TransactItems=[
                  {"Update": {
                      "TableName": TABLE_NAME,
                      "Key": {"pk": PK, "sk": review_id},
                      "UpdateExpression": "SET #n = :n, country = :c, message = :m, rating = :r, socials = :s, updatedAt = :u",
                      "ConditionExpression": "attribute_exists(pk) AND userId = :uid",
                      "ExpressionAttributeNames": {"#n": "name"},
                      "ExpressionAttributeValues": {
                          ":n": name, ":c": country, ":m": message, ":r": rating, ":s": socials, ":u": now_ms, ":uid": c["sub"],
                      },
                  }},
                  stats_update(0, rating - int(item["rating"])),
              ])
              log("info", "review_updated", reviewId=review_id, userId=c["sub"])
              item.update(name=name, country=country, message=message, rating=rating, socials=socials, updatedAt=now_ms)
              return resp(200, public(item))


          def delete_review(event):
              c = claims(event)
              review_id = event["pathParameters"]["id"]
              item = get_review(review_id)
              admin = is_admin(c)
              if item["userId"] != c["sub"] and not admin:
                  raise PermissionError("You can only delete your own review")
              client.transact_write_items(TransactItems=[
                  {"Delete": {
                      "TableName": TABLE_NAME,
                      "Key": {"pk": PK, "sk": review_id},
                      "ConditionExpression": "attribute_exists(pk)",
                  }},
                  stats_update(-1, -int(item["rating"])),
              ])
              log("info", "review_deleted", reviewId=review_id, userId=c["sub"], byAdmin=admin)
              return resp(200, {"ok": True})


          ROUTES = {
              "GET /reviews": list_reviews,
              "POST /reviews": create_review,
              "PUT /reviews/{id}": update_review,
              "DELETE /reviews/{id}": delete_review,
          }


          def handler(event, context):
              fn = ROUTES.get(event.get("routeKey"))
              if not fn:
                  return resp(404, {"error": "Not found"})
              try:
                  return fn(event)
              except ValueError as e:
                  return resp(400, {"error": str(e)})
              except PermissionError as e:
                  return resp(403, {"error": str(e)})
              except LookupError as e:
                  return resp(404, {"error": str(e)})
              except Exception:
                  log("error", "unhandled", trace=traceback.format_exc())
                  return resp(500, {"error": "Internal error"})
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------
  # API: HTTP API, JWT authorizer backed by Cognito, per-route throttling
  # ---------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Distribution.DomainName}'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
        MaxAge: 600
      Tags:
        project: !Ref ProjectName

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-jwt
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  ListReviewsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /reviews'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'

  CreateReviewRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /reviews'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'

  UpdateReviewRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /reviews/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'

  DeleteReviewRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /reviews/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      RouteSettings:
        'POST /reviews':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        'PUT /reviews/{id}':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        'DELETE /reviews/{id}':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # ---------------------------------------------------------------
  # FRONTEND: private S3 bucket served only through CloudFront (OAC)
  # ---------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: !Ref ProjectName

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} frontend'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingDisabled for the workshop. In production use CachingOptimized
          # (658327ea-f89d-4fab-a63d-7e88639e58f6) and invalidate on deploy.
          CachePolicyId: 4135ea2d-6df8-4a44-8b8f-0f4fbd0a7b4a
      Tags:
        - Key: project
          Value: !Ref ProjectName

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  CognitoDomainUrl:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  TableName:
    Value: !Ref MessagesTable
